name: Build BrightBean Studio image

# Bouwt het Docker-image van brightbeanxyz/brightbean-studio (AGPL-3.0) op GitHub
# in plaats van op de Coolify-VPS, en zet het op GHCR. Eigen aanpassingen staan als
# patch in patches/ en worden vóór het bouwen toegepast (zie README).
# Bijwerken: zet een nieuwe commit-SHA in BRIGHTBEAN_REF en push,
# of start deze workflow handmatig met een andere ref.

on:
  push:
    branches: [main]
    paths:
      - BRIGHTBEAN_REF
      - patches/**
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, branch of tag van brightbeanxyz/brightbean-studio (leeg = BRIGHTBEAN_REF)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ruben-wadup/brightbean-studio
  UPSTREAM: brightbeanxyz/brightbean-studio

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout deze repo
        uses: actions/checkout@v4

      - name: Bepaal upstream-ref
        id: ref
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          REF="${INPUT_REF:-$(tr -d '[:space:]' < BRIGHTBEAN_REF)}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout BrightBean Studio
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ steps.ref.outputs.ref }}
          path: src

      - name: Eigen patches toepassen
        id: patches
        run: |
          shopt -s nullglob
          files=(patches/*.patch)
          if [ ${#files[@]} -eq 0 ]; then
            echo "suffix=" >> "$GITHUB_OUTPUT"
            echo "Geen patches; image is ongewijzigd upstream."
            exit 0
          fi
          for p in "${files[@]}"; do
            echo "Toepassen: $p"
            git -C src apply --whitespace=nowarn "$GITHUB_WORKSPACE/$p"
          done
          # Tag-achtervoegsel volgt de inhoud van de patches: zelfde patches = zelfde tag.
          hash=$(cat "${files[@]}" | sha256sum | cut -c1-8)
          echo "suffix=-wadup.$hash" >> "$GITHUB_OUTPUT"

      - name: Tag bepalen
        id: sha
        run: |
          short=$(git -C src rev-parse --short=12 HEAD)
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "tag=${short}${{ steps.patches.outputs.suffix }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build en push
        uses: docker/build-push-action@v6
        with:
          context: src
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.sha.outputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.sha.outputs.tag }}
            org.opencontainers.image.licenses=AGPL-3.0
            org.opencontainers.image.description=BrightBean Studio van github.com/${{ env.UPSTREAM }} met de patches uit github.com/${{ github.repository }}/tree/main/patches
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Samenvatting
        run: echo "Image gebouwd - ${{ env.IMAGE }}:${{ steps.sha.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
